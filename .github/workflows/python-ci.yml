name: Python CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    # ✅ 全局指定工作目录，所有步骤自动进入这个文件夹！不用反复cd
    defaults:
      run:
        working-directory: ./3124004441

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run pytest
      run: |
        pytest test_main.py -v

    - name: Run simhash demo
      run: |
        python main.py orig.txt orig_0.8_add.txt github_out.txt
        cat github_out.txt
